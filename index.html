<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="theme-color" content="#111" />
<meta name="description" content="Habla — a simple Latin American Spanish trainer. Cards, quizzes, and audio. Share with friends." />
<link rel="manifest" href="manifest.json" />
<link rel="icon" href="icon.svg" />
<title>Habla</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #111; color: #f4f1ea; }
  main { max-width: 480px; margin: 0 auto; padding: calc(16px + env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom)); }
  h1 { font-size: 22px; font-weight: 650; margin: 0; }
  .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .count { color: #9c958b; font-size: 13px; }
  p.sub { color: #9c958b; margin: 0 0 12px; font-size: 14px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
  button, input { font: inherit; color: inherit; }
  .tabs button { background: #1c1c1c; border: 1px solid #2c2c2c; border-radius: 999px; padding: 8px 12px; }
  .tabs button.on { background: #f4f1ea; color: #111; border-color: #f4f1ea; }
  .tabs button small { opacity: .6; font-size: 12px; }
  .card { width: 100%; text-align: left; background: #1b1b1b; border: 1px solid #2c2c2c; border-radius: 16px; padding: 26px 18px 22px; min-height: 200px; }
  .es { font-size: 30px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.15; }
  .en { margin-top: 12px; font-size: 18px; }
  .hint { color: #c4a574; margin-top: 6px; font-size: 14px; }
  .ex { margin-top: 14px; padding-top: 12px; border-top: 1px solid #2c2c2c; font-size: 15px; }
  .ex span { display: block; color: #9c958b; margin-top: 2px; }
  .muted { color: #9c958b; margin-top: 12px; font-size: 14px; }
  .row { display: flex; gap: 8px; margin-top: 12px; }
  .row button, .choice { flex: 1; border: 0; border-radius: 12px; padding: 14px 10px; font-weight: 600; }
  .row button { background: #2a2a2a; }
  .row button.primary { background: #f4f1ea; color: #111; }
  .row button.soft { background: #243028; }
  .choices { display: grid; gap: 8px; margin-top: 12px; }
  .choice { text-align: left; background: #1c1c1c; border: 1px solid #2c2c2c; }
  .choice.ok { background: #1d3a2c; border-color: #3d7a56; }
  .choice.no { background: #3d2422; border-color: #a85a4e; }
  .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; color: #9c958b; font-size: 13px; }
  button.speak, button.icon { background: #1c1c1c; border: 1px solid #2c2c2c; border-radius: 999px; padding: 6px 10px; font-size: 14px; }
  .bar { height: 3px; background: #2a2a2a; border-radius: 99px; margin: 0 0 12px; overflow: hidden; }
  .bar span { display: block; height: 100%; background: #c4a574; }
  .namebox { display: flex; gap: 8px; margin: 0 0 12px; }
  .namebox input { flex: 1; background: #1c1c1c; border: 1px solid #2c2c2c; border-radius: 12px; padding: 10px 12px; }
  .toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #f4f1ea; color: #111; border-radius: 999px; padding: 8px 14px; font-size: 14px; font-weight: 600; opacity: 0; pointer-events: none; transition: opacity .2s; }
  .toast.on { opacity: 1; }
  details { margin-top: 16px; color: #9c958b; font-size: 14px; }
  summary { cursor: pointer; }
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast"></div>
<script src="sets.js"></script>
<script src="app.js"></script>
</body>
</html>
